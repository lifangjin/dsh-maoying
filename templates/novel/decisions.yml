# decisions.yml —— 拍板账：用户做过的方向性决策。方向性拍板（题材基调、金手指、
# 分卷规划、共创模式切换等）经用户确认后由主编追加一条；越出既有拍板范围的重大
# 变更须先再拍板再动笔。审校与主编以此核对改动是否越权。顶层数组、条目平键。
- id: dec-001            # 编号不复用
  topic: 分卷规划         # 决策点（设定共创/金手指/基调/分卷规划/……）
  decision: ""           # 一句话决定
  scope: ""              # 可选：影响范围（卷号/章节号/全书），全书可留空
  date: ""               # YYYY-MM-DD
  source: chat           # chat（对话拍板）| panel（面板操作），缺省 chat
