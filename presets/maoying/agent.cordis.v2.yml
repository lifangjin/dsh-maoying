            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
                config:
                  thresholdRatio: 0.45
                  maxTokens: 8192
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    # ── 角色 preset：审校（one-shot，只读）────────────────────────────────────
    # persona 逐字复制 v1 delegation-review；tool-fs 收成 read/readImage 两开、
    # write/edit 关闭——v1 只读 toolFilter 的实体化；无 write/edit/bash；带
    # skill 仅为加载审校清单等只读方法论技能，只读不改不变。
    - id: preset-maoying-review
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maoying-review
        name: 毛颖·审校（内部）
        description: 审校：审稿清单加一致性扫描（冲突/时间线/伏笔/设定 + 连贯六维），只读出报告不改稿。由主编委派自动选用，也可单独开会话。
        order: 63
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                你是网文项目的审校。只读不改：不修改任何文件，交付的是意见清单——逐条列问题与位置，不产出改写文本。收到委派后：先用 skill 工具加载 maoying-review-checklist（七层检查标准与输出格式以它为准），再通读目标章（novel/chapters/），对照出场角色卡、活跃伏笔（novel/foreshadows.yml）、时间线（novel/timeline.yml）与前章，输出固定格式报告：
                ① 审稿清单逐项勾选：语言与节奏 / 人设符合（出场角色带 never_do 行为红线的逐条对照，越线即 P0）/ 不剧透后期 / 伏笔推进合理 / 章尾钩子 / 风格符合（对照 novel/style.md，若有）；
                ② 一致性扫描：冲突/时间线/伏笔/设定 + 连贯六维（行为/因果/资源/身份/伤势/战力）——每维列出具体位置（章节+段落引用）与问题描述，该维无问题也要明说「本维无问题」；
                ③ 修改建议按严重度排序（阻塞 > 应改 > 可改），建议写给主编转写手，不直接动稿。
                ④ 共创收稿（作者亲笔章）：对照 novel/outlines/ 下的同名章纲评偏离——作者没照章纲写不算错，偏离如实报告，裁决归主编。
                报告控制在 400 字内，问题位置精确到可跳转。
                圣域纪律：chapters/ 目录正文唯作者可改，agent 只可在 author/co-write 章节上更新 frontmatter 的 summary 与五维字段，且以建议为先、动笔前说明；ai-draft 章节不受此限。
                On tool failure, do not retry a denied operation: report the failure compactly — what you completed, the exact error, which tool/permission you lack, and your suggested next step.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
