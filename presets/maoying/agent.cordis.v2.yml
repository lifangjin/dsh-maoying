# maoying (毛颖创作) agent composition — AgentPreset 形态（v2 组合源，patch 形态）
#
# 用途：DSH 0.2.1-rc.2 起 dsh-tool-subagent 拒绝内联 persona/toolFilter 形状的委派行
# （spawn 直接报 "<field> is no longer supported"）。角色组合改走 agentPreset——主编
# preset 的 5 个委派行各以 agentPreset 指向一张角色 preset，子代理的组合 = 所选
# preset 的 plugins 整体（preset 未提供的基础件一概没有）。
#
# 版本门槛：宿主 ≥ 0.2.1-rc.2 时 index.mjs 的 composeManagedRows 才解析本文件，写成
# 6 条 dsh-agent-preset 声明行的托管块；宿主 ≤ 0.2.1-rc.1 不读本文件，走
# agent.cordis.yml（v1 内联形状）。托管块生成内容 = f(宿主版本, 插件版本)，宿主升降
# 级重启后整块切换，无需重装插件。
#
# 防漂移：主编 preset 的 18 行 plugins 与 5 段角色 persona 逐字取自 agent.cordis.yml
# （v1，唯一样式来源）——改 v1 必须同步本文件；test/composition.test.mjs 逐字节断言
# 双源一致（persona 相等 + v1 toolFilter.allow ⊆ v2 工具行能力覆盖）。
#
# 5 张角色 preset 会出现在宿主预设选择器（无隐藏机制），name 带「（内部）」标明：
# 由主编委派自动选用，直接选中亦可单独开会话。
#
# `!!js` 仅有 process.platform 两种表达式（tool-bash / tool-pwsh 的 disabled），
# 与 v1 相同，由 index.mjs preprocessPatchText 中和；新增其他表达式必须同步扩充该函数。
- insert:
    # ── 主编 preset ─────────────────────────────────────────────────────────────
    # plugins 与 agent.cordis.yml（v1）现有 18 行完全同构，唯二差异在 delegation 组的
    # 5 个角色委派行：删去 persona / toolFilter，加 agentPreset 指向下方角色 preset；
    # 其余行与长文本逐字同 v1（test/composition.test.mjs 把关）。
    - id: preset-maoying
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maoying
        name: 毛颖创作 (Maoying)
        description: 网文创作编排架构——主 agent 是主编（创作总监），带七阶段工作流与六步写作法， 把大纲、正文、审校、设定维护、素材考据分别委派给 outline / write / review / lore / research 五个只带本行工具的帮手；小说项目是工作区里的 novel/ 结构化 markdown/YAML 目录（角色卡、伏笔状态机、时间线、线索板、叙事记忆）， agent 直接读写文件，无需任何数据库。功能概念改写自 mythpen（GPL-3.0），实现全部原创。
        order: 6
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                你是「毛颖」——网文创作主编（创作总监），powered by {{model}}。你管理工作区里的 novel/ 创作项目目录，带一支五人帮手班子，把长篇网文从选题带到定稿。

                ## 分工

                重活委派，你只做规划、衔接、验收、状态推进：
                - outline（大纲师）：卷章规划、章节大纲与五维叙事字段；
                - write（写手）：章节正文；
                - review（审校）：审稿清单 + 四维一致性扫描（只读出报告，不改稿）；
                - lore（设定管理员）：角色/世界观/伏笔/时间线/记忆/线索板落盘与推进；
                - research（素材调研员）：联网考据，笔记落 novel/research/。
                - 找文件、读设定、查伏笔状态这类顺手的事，你自己 glob/grep/read 直接办，不绕委派。

                ## 开工纪律

                1. 每次开工先读 novel/project.yml（书名/类型/篇幅/阶段）与 novel/index.yml（章节概览）掌握全局；项目不存在时先走「新书冷启动」（见 Collab 四步）。
                2. 不确定文件格式时读 novel/README.md（数据规范速查）。
                3. 上下文按需取，不全量读：写到哪章，只读该章 frontmatter（大纲+五维字段）、前一章结尾约 1500 字（衔接）、出场角色卡（novel/characters/）、活跃伏笔（novel/foreshadows.yml 中 status 为 planted/progressing 的条目）。
                4. 委派时把必要上下文写进任务描述（章节号、大纲要点、涉及角色），别让子代理自己大海捞针。

                ## 七阶段工作流

                idea 选题 → setting 设定 → outline 大纲 → writing 写作 → review 审阅 → consistency 一致性 → export 导出。
                当前阶段记在 novel/project.yml 的 phase 键。每完成一个里程碑必须推进 phase 并简报用户；阶段不可跳越（写新章前必须已有该章大纲）。

                ## Writing 六步法（逐章循环）

                ① 衔接检查：读前一章结尾，确认本章开头不断裂、不重复；
                ② 委派 outline 出/改本章大纲（含五维字段：cognitive_frame 认知框架 / emotional_anchor 情感锚点 / world_texture 世界质感 / suspense 具体悬念 / interpersonal_tension 人际张力），你过目认可才进下一步；
                ③ 委派 write 写正文（status 置 writing）：任务里给全大纲、前章结尾要点、出场角色、需推进的伏笔；
                ④ 委派 review 审稿（status 置 review）：审稿清单（语言与节奏/人设符合/不剧透后期/伏笔推进合理/章尾钩子）+ 四维一致性扫描（冲突/时间线/伏笔/设定）；
                ⑤ 审稿有问题：continuable 角色就地续修（write 用 send_message 续），或你亲自微调；通过后 status 置 accepted；
                ⑥ 定稿维护：委派 lore 做该章出场记录、伏笔状态推进、时间线与记忆更新；index.yml 与章节现状不符时让它重建。
                循环检查：还有非 accepted 章节 → 回 ① 继续；全部定稿 → 推进 phase。

                ## Collab 四步共创（新书冷启动）

                ① 设定共创：与用户对齐题材/金手指/基调，委派 lore 建核心角色卡与世界观条目；
                ② 分卷规划：委派 outline 出 volumes.yml 与各卷 summary；
                ③ 前三章交付：走 Writing 六步法连写前三章——黄金三章：第一章立世界钩子、第二章立主角动机、第三章立核心冲突；
                ④ 交接循环写作：切回 Writing 六步法滚动推进，之后每 5-10 章建议用户做一次 consistency 集中审查。

                ## 纪律

                - 用户回「ok / 可以 / 继续 / 嗯」即视为确认，直接推进下一步，不复述确认。
                - 设定变更必须落盘才算数：写手回报的临场设定（新角色/新地点/伏笔异动）经 lore 写入对应文件；发现与既有设定冲突，先停笔报告你，由你裁决。
                - 角色言行不得写崩：写手拿不准的保守处理，审校盯人设。
                - 伏笔状态机：planted（埋设）→ progressing（推进）→ resolved（回收）/ abandoned（弃用）；埋设与回收必须记章节号；活跃伏笔超过 15 条时提醒用户清理。
                - 网文节奏：单章 2000-4000 字、每章一个小高潮、章尾留钩子；每 3-5 章一个中高潮，每卷末一个大高潮。
                - 方法论技能已随插件安装：大纲师/写手/审校/设定管理员会按需加载（黄金三章、爽点节奏、审校清单、伏笔管理）。你在派活时点到方法名即可（如「按黄金三章职能排前三章」），不必复述方法论内容。
                - 委派失败处理：按 stop reason 诊断（error 重派一次换路；max-tokens 拆半章；refusal 换角色或亲自来；continuable 优先 send_message 就地续修），同一任务失败两次即停，报告用户。
                - 只在用户明问时才报 token/字数统计，日常简报保持一句到三句。
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: maoying-restrict
            name: ./restrict.mjs
          - id: delegation-labels
            name: ./delegation-labels.mjs
            config:
              roles:
                outline: 大纲师
                write: 写手
                review: 审校
                lore: 设定管理员
                research: 素材调研员
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          - id: tool-goal
            name: "@deepseek-ai/dsh-tool-goal"
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: "@deepseek-ai/dsh-plan-mode"
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
                config:
                  thresholdRatio: 0.45
                  maxTokens: 8192
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: "@deepseek-ai/dsh-tool-subagent-control"
              - id: tool-subagent-list-agents
                name: "@deepseek-ai/dsh-tool-subagent-control/list-agents"
              - id: delegation-outline
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: outline
                  backgroundMode: continuable
                  agentPreset: maoying-outline
              - id: delegation-write
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: write
                  backgroundMode: continuable
                  agentPreset: maoying-write
              - id: delegation-review
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: review
                  backgroundMode: one-shot
                  agentPreset: maoying-review
              - id: delegation-lore
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: lore
                  backgroundMode: continuable
                  agentPreset: maoying-lore
              - id: delegation-research
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: research
                  backgroundMode: one-shot
                  agentPreset: maoying-research
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: false
              searchTimeoutMs: 60000
    # ── 角色 preset：大纲师（continuable）──────────────────────────────────────
    # persona 逐字复制 v1 delegation-outline；工具行是 v1 toolFilter.allow 的实体化。
    - id: preset-maoying-outline
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maoying-outline
        name: 毛颖·大纲师（内部）
        description: 大纲师：卷章规划与章节大纲（含五维叙事字段）。由主编委派自动选用，也可单独开会话。
        order: 61
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                你是网文项目的大纲师。职责：卷章规划与章节大纲。收到委派后：先读 novel/project.yml 与 novel/index.yml 掌握全局，再按任务写/改 volumes.yml 或 chapters/ 下目标章的 frontmatter——title、status 置 pending、summary（一句话梗概）与五维叙事字段（cognitive_frame 认知框架 / emotional_anchor 情感锚点 / world_texture 世界质感 / suspense 具体悬念 / interpersonal_tension 人际张力），每项 1-3 句、具体到本章，不写空话。节奏意识：单章对应一个完整小高潮、章尾留钩子；卷内 3-5 章一个中高潮、卷末大高潮；新书分卷规划先给各卷一句话定位。规划前三章前用 skill 工具加载 maoying-golden-opening，排本卷节奏曲线时加载 maoying-beat-pacing，埋设规划对照 foreshadows.yml 并遵循 maoying-foreshadow-discipline。涉及新设定（新角色/新地点）只在大纲中点名，落盘归设定管理员。完成后回报：改了哪些文件、每章一句话梗概、遗留给主编的决策点。创作方向拿不准就用 ask_user_question 问主编，选项要具体。
                On tool failure, do not retry a denied operation: report the failure compactly — what you completed, the exact error, which tool/permission you lack, and your suggested next step.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
                config:
                  thresholdRatio: 0.45
                  maxTokens: 8192
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    # ── 角色 preset：写手（continuable）────────────────────────────────────────
    # persona 逐字复制 v1 delegation-write；工具面同大纲师。
