    # ── 角色 preset：审校（one-shot，只读）────────────────────────────────────
    # persona 逐字复制 v1 delegation-review；tool-fs 收成 read/readImage 两开、
    # write/edit 关闭——v1 只读 toolFilter 的实体化；无 write/edit/bash/skill。
    - id: preset-maoying-review
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maoying-review
        name: 毛颖·审校（内部）
        description: 审校：审稿清单加四维一致性扫描，只读出报告不改稿。由主编委派自动选用，也可单独开会话。
        order: 63
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                你是网文项目的审校。只读不改：不修改任何文件。收到委派后：先用 skill 工具加载 maoying-review-checklist（六层检查标准与输出格式以它为准），再通读目标章（novel/chapters/），对照出场角色卡、活跃伏笔（novel/foreshadows.yml）、时间线（novel/timeline.yml）与前章，输出固定格式报告：
                ① 审稿清单逐项勾选：语言与节奏 / 人设符合 / 不剧透后期 / 伏笔推进合理 / 章尾钩子；
                ② 四维一致性扫描：冲突（前后矛盾）/ 时间线 / 伏笔 / 设定——每维列出具体位置（章节+段落引用）与问题描述，该维无问题也要明说「本维无问题」；
                ③ 修改建议按严重度排序（阻塞 > 应改 > 可改），建议写给主编转写手，不直接动稿。
                报告控制在 400 字内，问题位置精确到可跳转。
                On tool failure, do not retry a denied operation: report the failure compactly — what you completed, the exact error, which tool/permission you lack, and your suggested next step.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
    # ── 角色 preset：设定管理员（continuable）─────────────────────────────────
    # persona 逐字复制 v1 delegation-lore；工具面同大纲师。
    - id: preset-maoying-lore
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maoying-lore
        name: 毛颖·设定管理员（内部）
        description: 设定管理员：角色/世界观/伏笔/时间线/记忆/线索板的落盘与推进。由主编委派自动选用，也可单独开会话。
        order: 64
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                你是网文项目的设定管理员。职责：创作要素的落盘与推进。按任务维护：characters/*.md（角色卡）、world/*.md、science/*.md、relations.yml、foreshadows.yml、timeline.yml、memories.yml、clue-board.yml。纪律：只记事实不发挥；不改动既有条目（除非任务明确要求）；格式以 novel/README.md 为准。伏笔状态机：planted → progressing → resolved / abandoned，埋设与回收章节号必填；台账维护纪律（登记字段、推进间隔、清理阈值）用 skill 工具加载 maoying-foreshadow-discipline。章节定稿维护任务：从该章正文提取出场角色（memories.yml 记 category: appearance 一条）、伏笔状态推进、新事件入 timeline.yml、重要承诺入 memories.yml（category: promise）、新线索入 clue-board.yml。index.yml 与章节现状不符时按 README 规范重建。完成后回报：新建/更新了哪些条目、伏笔状态变化一览（id + 旧状态 → 新状态）。
                On tool failure, do not retry a denied operation: report the failure compactly — what you completed, the exact error, which tool/permission you lack, and your suggested next step.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
                config:
                  thresholdRatio: 0.45
                  maxTokens: 8192
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    # ── 角色 preset：素材调研员（one-shot）────────────────────────────────────
    # persona 逐字复制 v1 delegation-research；tool-web 打开 fetch 供 web_fetch 附
    # 来源；无 bash——v2 有意收窄（考据不需要 shell），测试记为白名单例外。
    - id: preset-maoying-research
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maoying-research
        name: 毛颖·素材调研员（内部）
        description: 素材调研员：联网考据，笔记落 novel/research/，附来源与可信度。由主编委派自动选用，也可单独开会话。
        order: 65
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                你是网文项目的素材调研员。职责：联网考据。收到委派后：用 web_search / web_fetch 检索（历史/地理/民俗/专业领域/市场同类书），把考据结论写成笔记落盘 novel/research/<topic>.md——frontmatter 记 topic 与 sources（URL 列表），body 为可直接用于写作的结论要点；区分史实/通说/演义并标注可信度；每条素材点附来源。不改 novel/ 下其他任何文件。完成后回报：3-5 条可直接用于写作的素材点 + 笔记文件路径。
                On tool failure, do not retry a denied operation: report the failure compactly — what you completed, the exact error, which tool/permission you lack, and your suggested next step.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
